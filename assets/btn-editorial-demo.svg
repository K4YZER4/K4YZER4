<svg xmlns="http://www.w3.org/2000/svg" width="190" height="36" viewBox="0 0 190 36" role="img" aria-label="SEE DEMO WEB">
  <title>SEE DEMO WEB</title>
  <defs>
    <clipPath id="demo-clip">
      <rect x="0.5" y="0.5" width="189" height="35" rx="2" />
    </clipPath>
    <linearGradient id="demo-bg-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="demo-text-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8a298" stop-opacity="0" />
      <stop offset="35%" stop-color="#9e988e" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#e2ddd3" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#9e988e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#a8a298" stop-opacity="0" />
    </linearGradient>
    <mask id="demo-label-mask">
      <rect x="0" y="0" width="190" height="36" fill="#000000" />
      <text x="42" y="21.5" class="label" fill="#ffffff">SEE DEMO WEB</text>
    </mask>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .bg-shimmer {
        animation: bgSweep 4.2s ease-in-out infinite;
      }
      .text-shimmer {
        animation: textSweep 4.2s ease-in-out infinite;
      }
      .arrow {
        animation: nudge 2.4s ease-in-out infinite;
      }
      .rule {
        animation: drawRule 4.2s ease-in-out infinite;
      }
      @keyframes bgSweep {
        0%   { transform: translateX(-80px) skewX(-18deg); opacity: 0; }
        12%  { opacity: 1; }
        46%  { transform: translateX(220px) skewX(-18deg); opacity: 1; }
        52%  { opacity: 0; }
        100% { transform: translateX(220px) skewX(-18deg); opacity: 0; }
      }
      @keyframes textSweep {
        0%   { transform: translateX(-10px) skewX(-18deg); opacity: 0; }
        10%  { opacity: 1; }
        44%  { transform: translateX(175px) skewX(-18deg); opacity: 1; }
        50%  { opacity: 0; }
        100% { transform: translateX(175px) skewX(-18deg); opacity: 0; }
      }
      @keyframes nudge {
        0%, 100% { transform: translateX(0px); }
        50%      { transform: translateX(3px); }
      }
      @keyframes drawRule {
        0%   { transform: scaleX(0); opacity: 0.75; }
        40%  { transform: scaleX(1); opacity: 1; }
        75%  { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0); opacity: 0.75; }
      }
    </style>
  </defs>

  <g clip-path="url(#demo-clip)">
    <rect x="0.5" y="0.5" width="189" height="35" rx="2" fill="#eeeae2" stroke="#171717" stroke-width="1" />
    <rect class="bg-shimmer" x="0" y="0" width="56" height="36" fill="url(#demo-bg-shimmer)" />

    <!-- Minimalist editorial globe icon -->
    <g fill="none" stroke="#171717" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="6" stroke-width="1.2" />
      <ellipse cx="18" cy="18" rx="2.8" ry="6" stroke-width="1.05" />
      <line x1="12" y1="18" x2="24" y2="18" stroke-width="1.05" />
      <path d="M13.2 15 Q18 16.2 22.8 15" stroke-width="1" />
      <path d="M13.2 21 Q18 19.8 22.8 21" stroke-width="1" />
    </g>

    <line x1="33" y1="10" x2="33" y2="26" stroke="#c8c3ba" stroke-width="1" />

    <text x="42" y="21.5" class="label" fill="#171717">SEE DEMO WEB</text>
    <g mask="url(#demo-label-mask)">
      <rect class="text-shimmer" x="0" y="6" width="44" height="24" fill="url(#demo-text-shimmer)" />
    </g>

    <g class="arrow">
      <line x1="163" y1="18" x2="174" y2="18" stroke="#171717" stroke-width="1.35" stroke-linecap="square" />
      <polyline points="170,14.5 174.5,18 170,21.5" fill="none" stroke="#171717" stroke-width="1.35" stroke-linecap="square" stroke-linejoin="miter" />
    </g>

    <rect class="rule" x="0.5" y="33.5" width="189" height="2" fill="#171717" style="transform-origin: 0.5px 34.5px;" />
  </g>
</svg>
